# Continuous integration: tests, lint, build, shellcheck and dependency audit
# for every push and pull request. Releases are built by release.yml (tags).
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            client/package-lock.json

      # sqlite3: the legacy SSH gateway tests drive the CLI. nginx: the installer tests
      # validate the generated nginx configurations with `nginx -t` (both are skipped when
      # the tool is missing, so install them explicitly).
      - name: Install sqlite3 and nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sqlite3 nginx

      # `nginx -t` binds ports 80/443. Let the unprivileged test user bind them on this
      # throwaway runner, and make sure no nginx service holds them.
      - name: Prepare nginx -t checks
        run: |
          sudo systemctl stop nginx 2>/dev/null || true
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0

      # backend/test/e2e-stack.test.js runs the real device client against the server.
      - name: Install client dependencies (end-to-end test)
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: backend
        run: npm test

  client:
    name: Client tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci --no-audit --no-fund

      - name: Test
        working-directory: client
        run: npm test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  release-tooling:
    name: Release tooling, updater and installer tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck

      - name: Test (unprivileged)
        run: node --test scripts/release/test/*.test.js

      # The installer end-to-end tests need root. They install into throwaway
      # directories under /tmp and stub systemctl/npm; the runner itself is not changed.
      - name: Test (as root, incl. installer end-to-end tests)
        run: sudo env "PATH=$PATH" node --test scripts/release/test/*.test.js

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck

      - name: shellcheck all shell scripts
        run: |
          set -euo pipefail
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 --no-run-if-empty shellcheck -x -P .
          git ls-files -z '*.sh' | xargs -0 -n1 bash -n

  audit:
    name: npm audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # frontend: its runtime dependencies are bundled into the dashboard
        package: [backend, client, frontend]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: npm audit --omit=dev --audit-level=high
        working-directory: ${{ matrix.package }}
        run: npm audit --omit=dev --audit-level=high
